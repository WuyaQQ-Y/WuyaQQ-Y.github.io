<style>
  :root{
    --paper:#f7f4ee;
    --paper-2:#efeade;
    --card:#fcfaf6;
    --ink:#1d1a15;
    --ink-2:#4a443a;
    --muted:#837a6b;
    --line:#ded6c6;
    --accent:#9d2b22;
    --max:1120px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
  a{color:inherit}
  img{display:block;max-width:100%}

  /* 顶栏 */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(247,244,238,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;height:62px}
  .brand{font-size:15px;letter-spacing:.14em;font-weight:600}
  .brand span{color:var(--accent)}
  nav{display:flex;gap:24px;font-size:14px;color:var(--ink-2)}
  nav a{text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent;transition:.25s}
  nav a:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:720px){nav{display:none}}

  /* 首屏 */
  .hero{padding:88px 0 64px}
  .hero .eyebrow{font-size:12.5px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:24px}
  .hero h1{font-size:clamp(28px,5.4vw,48px);line-height:1.3;font-weight:600;letter-spacing:.02em}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p.lede{margin-top:22px;max-width:620px;font-size:16px;color:var(--ink-2)}

  /* 区块 */
  section{padding:68px 0;border-top:1px solid var(--line)}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:34px}
  .sec-head .num{font-size:13px;color:var(--accent);letter-spacing:.2em}
  .sec-head h2{font-size:22px;font-weight:600;letter-spacing:.06em}
  .sec-head .hint{font-size:13px;color:var(--muted);margin-left:auto}
  @media(max-width:640px){.sec-head .hint{display:none}}

  /* 画廊 */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .shot{
    background:var(--paper-2);border:1px solid var(--line);border-radius:2px;
    overflow:hidden;cursor:zoom-in;position:relative;
  }
  .shot img{width:100%;height:230px;object-fit:cover;transition:transform .45s ease,opacity .3s}
  .shot:hover img{transform:scale(1.03)}
  .shot figcaption{
    font-size:12.5px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);
    background:var(--card);display:flex;justify-content:space-between;gap:10px;
  }
  .shot figcaption b{font-weight:400;color:var(--ink-2)}

  /* 展板（竖长图） */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;align-items:start}
  .board .shot img{height:auto;max-height:620px;object-fit:contain;background:var(--paper-2)}
  .board .note{font-size:14px;color:var(--ink-2);align-self:center;max-width:360px}
  .board .note h4{font-size:16px;font-weight:600;margin-bottom:10px}
  @media(max-width:760px){.board{grid-template-columns:1fr}}

  /* 平面图 */
  .plans{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
  @media(max-width:640px){.plans{grid-template-columns:1fr}}
  .plans .shot img{height:420px;object-fit:contain;background:#fff;padding:8px}

  /* 文档占位 */
  .docbox{
    border:1px dashed var(--line);border-radius:3px;padding:30px 28px;
    background:linear-gradient(180deg,rgba(252,250,246,.9),rgba(252,250,246,.35));
  }
  .docbox .tag{display:inline-block;font-size:11.5px;letter-spacing:.12em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:12px}
  .docbox h4{font-size:17px;font-weight:600;margin-bottom:8px}
  .docbox p{font-size:14px;color:var(--muted)}

  /* 小墨产出 */
  .works{display:grid;gap:26px}
  .wcard{
    display:grid;grid-template-columns:1.05fr 1fr;background:var(--card);
    border:1px solid var(--line);border-radius:3px;overflow:hidden;text-decoration:none;
    transition:box-shadow .3s,border-color .3s,transform .3s;
  }
  .wcard:hover{box-shadow:0 14px 34px rgba(29,26,21,.09);border-color:#cbbfa8;transform:translateY(-2px)}
  .wcard .thumb{background:var(--paper-2);min-height:240px}
  .wcard .thumb img{width:100%;height:100%;object-fit:cover}
  .wcard .body{padding:30px 30px;display:flex;flex-direction:column}
  .wcard .kicker{font-size:12.5px;letter-spacing:.2em;color:var(--accent);margin-bottom:12px}
  .wcard h3{font-size:20px;font-weight:600;margin-bottom:10px}
  .wcard p{font-size:14.5px;color:var(--ink-2);flex:1}
  .wcard .go{margin-top:16px;font-size:14px;color:var(--accent);letter-spacing:.06em}
  .wcard.plain{grid-template-columns:1fr}
  .wcard.plain .thumb{display:none}
  .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
  .mini figure{border:1px solid var(--line);background:var(--paper-2);border-radius:2px;overflow:hidden;cursor:zoom-in}
  .mini img{width:100%;height:110px;object-fit:cover}
  .mini figcaption{font-size:11.5px;color:var(--muted);padding:4px 7px;background:var(--card)}
  @media(max-width:820px){
    .wcard{grid-template-columns:1fr}
    .wcard .thumb{min-height:190px}
    .mini{grid-template-columns:repeat(2,1fr)}
  }

  /* 联系 */
  .contact-line{max-width:660px;color:var(--ink-2);font-size:15.8px}
  .contact-line a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(157,43,34,.35);padding-bottom:1px}
  .contact-line a:hover{border-color:var(--accent)}

  footer{border-top:1px solid var(--line);padding:30px 0 42px;font-size:12.8px;color:var(--muted)}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* 灯箱 */
  .lb{
    position:fixed;inset:0;z-index:200;background:rgba(20,18,15,.94);
    display:none;align-items:center;justify-content:center;padding:3vw;
  }
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:92vh;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .close{
    position:absolute;top:18px;right:24px;color:#f7f4ee;font-size:34px;
    line-height:1;cursor:pointer;opacity:.75;user-select:none;
  }
  .lb .close:hover{opacity:1}
  .lb .cap{
    position:absolute;bottom:18px;left:0;right:0;text-align:center;
    color:#cfc6b6;font-size:13px;letter-spacing:.06em;
  }
  @media(max-width:760px){
    .hero{padding:60px 0 44px}
    section{padding:52px 0}
    .shot img{height:200px}
    .plans .shot img{height:320px}
  }
</style>
</head>

<div class="lb" id="lb">
  <span class="close" id="lbClose">×</span>
  <img id="lbImg" src="" alt="">
  <div class="cap" id="lbCap"></div>
</div>

<script>
(function(){
  var lb = document.getElementById('lb'),
      lbImg = document.getElementById('lbImg'),
      lbCap = document.getElementById('lbCap');

  function open(img){
    lbImg.src = img.getAttribute('src');
    lbImg.alt = img.getAttribute('alt') || '';
    var cap = img.parentElement.querySelector('figcaption');
    lbCap.textContent = cap ? cap.innerText.replace(/\s+/g,' ').trim() : '';
    lb.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    lb.classList.remove('on');
    lbImg.src = '';
    document.body.style.overflow = '';
  }
  document.querySelectorAll('.shot img, .mini img').forEach(function(img){
    img.addEventListener('click', function(e){ e.preventDefault(); open(img); });
  });
  document.getElementById('lbClose').addEventListener('click', close);
  lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
})();
</script>
